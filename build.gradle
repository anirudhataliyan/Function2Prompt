def ghidraInstallDir = System.getenv("GHIDRA_INSTALL_DIR")
if (!ghidraInstallDir && project.hasProperty("GHIDRA_INSTALL_DIR")) {
    ghidraInstallDir = project.property("GHIDRA_INSTALL_DIR")
}
if (!ghidraInstallDir) {
    throw new GradleException("Set GHIDRA_INSTALL_DIR to your Ghidra installation root.")
}
def ghidraBuildFile = new File(ghidraInstallDir, "support/buildExtension.gradle")
if (!ghidraBuildFile.isFile()) {
    throw new GradleException("Invalid Ghidra root: " + ghidraInstallDir)
}
apply from: ghidraBuildFile
repositories {}
dependencies {}
